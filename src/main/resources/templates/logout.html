<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sair</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="min">
<span class="marca" style="position:absolute;top:2rem;left:2rem">Vendas</span>

<main class="pagina-estreita">
    <p class="rotulo">Encerrar sessão</p>
    <h1 class="titulo">Já vai?</h1>
    <p class="sub">Sua sessão será encerrada neste navegador.</p>

    <!-- O token CSRF é incluído automaticamente pelo Thymeleaf -->
    <form method="post" th:action="@{/logout}">
        <button type="submit" class="botao">Sair</button>
        <a class="link-discreto" th:href="@{/home}">Voltar</a>
    </form>
</main>
</body>
</html>
